# Render.com deploy konfigürasyonu
# Dökümantasyon: https://render.com/docs/blueprint-spec

services:
  # ─── PDF API (FastAPI / Python) ───────────────────────────────────────────
  - type: web
    name: nb-pdf-api
    branch: main              # SADECE main'e push'ta deploy et (calismaAlani'yi yok say)
    autoDeployTrigger: off  # Render OTOMATIK deploy etmez; CI (ci.yml "deploy" job'i) tum testler yesilse deploy hook ile tetikler
    # Docker runtime: native Python runtime'da apt-get çalışmaz (salt-okunur FS).
    # Sistem araçları (tesseract/poppler/wkhtmltopdf/ghostscript) Dockerfile'da kurulur.
    runtime: docker
    region: frankfurt         # EU kullanıcılarına yakın; değiştirilebilir
    plan: starter             # Starter (512MB): UYUMAZ → cold-start yok ("PDF kontrol
                              # ediliyor" takılması free plan cold-start'ından kaynaklanıyordu).
                              # Not: AI-OCR (docling/easyocr) ağır işler için ~2GB → 'standard'
                              # gerekir. Temel PDF araçları Starter'da çalışır; büyük dosya/OCR'da
                              # OOM olursa 'standard'a yükseltin.
    dockerfilePath: web/backend/Dockerfile
    dockerContext: .          # proje kökü — imaj hem web/backend hem paylaşılan src/ içerir
    healthCheckPath: /api/health   # router prefix="/api" → health endpoint /api/health
    envVars:
      - key: WEB_CONCURRENCY
        value: "1"            # free 512 MB RAM için tek gunicorn worker (OOM'u önler)
      - key: PDF_API_HOST
        value: "0.0.0.0"
      - key: PDF_CPU_WORKERS
        value: "1"            # 512MB starter: ağır PDF işlemlerini SIRAYA al (aynı anda tek
                              # işlem) → tepe bellek ~yarıya iner, OOM/restart önlenir. Büyük
                              # plana (standard 2GB) geçince 2+ yapılabilir.
      - key: TRUSTED_HTTPS
        value: "true"
      - key: ENVIRONMENT
        value: "production"
      # Entitlement/kota kontrolü için Auth API kökü (servisler arası çağrı)
      - key: NB_SAAS_API_BASE
        sync: false   # Örn. https://auth-api.pdfplatform.app
      # S3 lifecycle TTL (saat) — sonuç dosyaları 24 saat sonra otomatik silinir
      - key: S3_RESULT_TTL_HOURS
        value: "24"
      - key: S3_REGION
        sync: false   # Örn. eu-central-1 (AWS) veya auto (Cloudflare R2)
      # PDF Sandbox: her işlemi ayrı bir subprocess'te (fork) izole eder.
      # KAPALI: fork, thread-havuzu thread'inden yapıldığı için Linux'ta deadlock
      # oluşturuyordu → inspect/araçlar ~10 dk (op timeout) takılıyordu. Kapatınca
      # yereldeki (Windows = fork yok) ile aynı thread-havuzu yolu kullanılır → çalışır.
      # İzolasyonu geri istersek spawn + üst-seviye (picklable) fonksiyon ya da
      # ön-fork edilmiş süreç havuzu ile yeniden kurmak gerekir.
      - key: PDF_SANDBOX_ENABLED
        value: "false"
      - key: PDF_SANDBOX_MEM_MB
        value: "384"    # free 512MB için düşük tutuldu (taşan işlem host'u OOM etmeden kesilir).
                        # Büyük plana geçince 1024'e çıkarılabilir.
      - key: PDF_SANDBOX_CPU_SEC
        value: "120"    # Her alt süreç için maksimum 120 saniye CPU
      - key: SENTRY_DSN
        sync: false   # Render dashboard'dan set edin
      - key: CORS_ORIGINS
        sync: false   # Render dashboard'dan set edin (örn. https://pdfplatform.app)
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      # PDF Düzenle günlük indirme sayacı — Node/Postgres köprüsü için PAYLAŞILAN secret.
      # AYNI değeri nb-auth-api'de de gir. Boşsa yerel SQLite'a düşer (instance başına, deploy'da sıfırlanır).
      - key: INTERNAL_SERVICE_SECRET
        sync: false
      # Oturum jetonu imzalama sırrı — nb-auth-api ile AYNI değer olmalı.
      # Tanımlıysa jeton doğrulaması ve kullanıcı kimliği BURADA çözülür; her PDF
      # isteği için Auth API'ye HTTP çağrısı yapılmaz (gecikme + tek noktadan
      # kilitlenme riski ortadan kalkar). Boşsa eski davranışa düşülür.
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: EDITOR_GUEST_DAILY_LIMIT
        value: "2"
      - key: EDITOR_FREE_DAILY_LIMIT
        value: "5"

  # ─── Auth API (Express / Node.js) ─────────────────────────────────────────
  - type: web
    name: nb-auth-api
    branch: main              # SADECE main'e push'ta deploy et (calismaAlani'yi yok say)
    autoDeployTrigger: off  # Render OTOMATIK deploy etmez; CI (ci.yml "deploy" job'i) tum testler yesilse deploy hook ile tetikler
    runtime: node
    region: frankfurt
    plan: starter             # Starter: UYUMAZ → cold-start yok. Site açılışı (public/runtime)
                              # bu servisi beklediği için free plan ~30-50 sn loading'e yol açıyordu.
    rootDir: web/api
    # PostgreSQL şeması (schema.postgres.prisma) ile generate + db push.
    # Not: migrations/ klasörü SQLite diyalektinde olduğu için Postgres'e
    # uygulanamaz; bunun yerine db push şemayı doğrudan Neon'a senkronlar.
    buildCommand: npm ci && npx prisma generate --schema prisma/schema.postgres.prisma && npm run build && npx prisma db push --schema prisma/schema.postgres.prisma --skip-generate --accept-data-loss && npm run prisma:seed
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: TRUSTED_HTTPS
        value: "true"
      # Render edge TLS sonlandırır; X-Forwarded-* başlıklarına güven
      - key: TRUST_PROXY
        value: "1"
      - key: FORCE_HTTPS
        value: "true"
      - key: DATABASE_URL
        sync: false   # PostgreSQL URL'si + havuz parametreleri:
                      # postgresql://user:pass@host/db?connection_limit=10&pool_timeout=30
                      # connection_limit: Render starter (paylaşımlı CPU) için 10 önerilir
                      # pool_timeout: uzun PDF sorgularında zaman aşımını önlemek için 30 sn
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      # PDF Düzenle indirme sayacı köprüsü — nb-pdf-api ile AYNI değer olmalı.
      - key: INTERNAL_SERVICE_SECRET
        sync: false
      - key: EDITOR_GUEST_DAILY_LIMIT
        value: "2"
      - key: EDITOR_FREE_DAILY_LIMIT
        value: "5"
      - key: BILLING_ENCRYPTION_KEY
        sync: false
      - key: IYZICO_API_KEY
        sync: false
      - key: IYZICO_SECRET_KEY
        sync: false
      - key: IYZICO_URI
        sync: false   # Test: https://sandbox-api.iyzipay.com | Gerçek: https://api.iyzipay.com
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ROLE_ADMIN_EMAIL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false   # Örn. https://pdfplatform.app
      - key: APP_BASE_URL
        sync: false   # Örn. https://api.pdfplatform.app
      - key: PAYMENT_CALLBACK_BASE_URL
        sync: false   # iyzico callback kökü; APP_BASE_URL ile aynı olmalı
      - key: OAUTH_FRONTEND_REDIRECT_ORIGIN
        sync: false   # Google OAuth sonrası yönlendirme; FRONTEND_ORIGIN ile aynı
      - key: GOOGLE_CLIENT_ID
        sync: false   # Google OAuth (boş bırakılırsa Google girişi devre dışı)
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: REDIS_URL
        sync: false   # Upstash Redis önerilir (kötüye kullanım takibi + kalıcı sayaç)

  # ─── Frontend (Static Site) ────────────────────────────────────────────────
  # Not: Static site'lar global CDN'den servis edilir; `region` ve `plan`
  # alanları desteklenmez (her ikisi de blueprint doğrulama hatası verir).
  - type: web
    name: nb-pdf-frontend
    branch: main              # SADECE main'e push'ta deploy et (calismaAlani'yi yok say)
    autoDeployTrigger: off  # Render OTOMATIK deploy etmez; CI (ci.yml "deploy" job'i) tum testler yesilse deploy hook ile tetikler
    runtime: static
    rootDir: web/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # SPA fallback: tüm yollar index.html'e döner (React Router için)
    # ── Prerender SEO sayfalari: slash'siz URL'leri dizin index.html'ine yonlendir ──
    # SORUN: sitemap/canonical slash'siz URL kullanir (/pricing, /tools/x). Render bir
    # yolda GERCEK dosya varsa kurallari atlar; /pricing/ (slash'li) dogru gelir ama
    # /pricing (slash'siz) dosya sayilmaz -> asagidaki catch-all ana sayfayi donerdi
    # -> Google tum prerender sayfalarini ana sayfanin kopyasi sanip indekslemiyordu.
    # COZUM: slash'siz varyantlari acikca prerender dosyasina rewrite et. Named
    # placeholder (:slug) TEK segment eslesir (Render dokuman ornegi: /:year/:month).
    # SPA-only rotalar (/login /register /workspace /admin ...) bu prefix'lerde
    # OLMADIGI icin etkilenmez; en sondaki /* catch-all'a duser.
    routes:
      # ── ESKI TURKCE /en SLUG'LARI → INGILIZCE SLUG (kalici 301) ──────────────
      # /en altindaki sayfalar Ingilizce icerik sunuyordu ama URL segmenti Turkce
      # kaliyordu (/en/blog/pdf-word-donusturme). Slug'lar Ingilizceye cevrildi
      # (web/frontend/src/seo/enSlugs.mjs); eski adresler link ve indeks degeri
      # kaybolmasin diye kalici olarak yeni adrese tasiniyor.
      # NOT: Rewrite kurallarindan ONCE gelmeli — Render route'lari SIRAYLA isler.
      - type: redirect
