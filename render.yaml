        name: X-Frame-Options
        value: SAMEORIGIN
      - path: "/*"
        name: X-Content-Type-Options
        value: nosniff
      - path: "/*"
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: "/*"
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), interest-cohort=()"
      - path: "/*"
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains; preload"
      - path: "/*"
        name: Cross-Origin-Opener-Policy
        value: same-origin
      # XSS azaltımı. connect-src API origin'lerini içermeli — kendi VITE_SAAS_API_BASE /
      # VITE_API_BASE değerlerinizle eşleştiğini doğrulayın (wildcard'lar onrender + pdfplatform.app'i kapsar).
      # NOT: 'wasm-unsafe-eval' — Belge tarayıcı (Scanic, Rust→WASM) WebAssembly
      # derlemesi için gerekir; 'eval'/'new Function' KULLANMAZ, bu yüzden 'unsafe-eval'
      # GEREKMEZ (OpenCV.js'in aksine — o kaldırıldı). Tarama motoru cihazda çalışır.
      - path: "/*"
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com; worker-src 'self' blob:; manifest-src 'self'; connect-src 'self' blob: data: https://*.onrender.com https://*.pdfplatform.app https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io https://ipapi.co https://ipwho.is https://*.iyzipay.com; frame-src 'self' https://*.iyzipay.com; form-action 'self' https://*.iyzipay.com; upgrade-insecure-requests"
      # Özel/işlevsel rotalar arama indeksinden çıkarılır. Google önerisi: bu sayfaları
      # robots.txt ile ENGELLEME (engelliyse noindex görülemez) — taramaya izin ver +
      # X-Robots-Tag: noindex ver. robots.txt yalnızca /api/'yi engeller.
      - path: "/workspace"
        name: X-Robots-Tag
        value: "noindex, nofollow"
      - path: "/workspace/*"
        name: X-Robots-Tag
        value: "noindex, nofollow"
      - path: "/admin"
        name: X-Robots-Tag
        value: "noindex, nofollow"
      - path: "/admin/*"
        name: X-Robots-Tag
        value: "noindex, nofollow"
      - path: "/nbadmin"
        name: X-Robots-Tag
        value: "noindex, nofollow"
      - path: "/nbadmin/*"
        name: X-Robots-Tag
        value: "noindex, nofollow"
      - path: "/admin-login"
        name: X-Robots-Tag
        value: "noindex, nofollow"
      - path: "/login-success"
        name: X-Robots-Tag
        value: "noindex, nofollow"
      # Asset'ler içerik hash'li — uzun süre cache'lenir
      - path: "/assets/*"
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      # index.html ve SEO HTML'leri asla cache'lenmemeli (yeni deploy hemen yansır)
      - path: "/index.html"
        name: Cache-Control
        value: "no-cache, no-store, must-revalidate"
      # Service worker ve manifest cache'lenmemeli ki PWA güncellemeleri hemen yansısın
      - path: "/sw.js"
        name: Cache-Control
        value: "no-cache, no-store, must-revalidate"
      - path: "/manifest.webmanifest"
        name: Cache-Control
        value: "no-cache, must-revalidate"
      - path: "/sitemap.xml"
        name: Cache-Control
        value: "public, max-age=3600"
    envVars:
      - key: VITE_API_BASE
        sync: false   # PDF API kökü, örn. https://nb-pdf-api.onrender.com
      # ÜRETİMDE GEREKEN auth API kökü — SPA login/ödeme/bakım bunu kullanır.
      # (VITE_SAAS_PROXY_TARGET yalnızca yerel Vite dev proxy'sidir; üretimde işe yaramaz.)
      - key: VITE_SAAS_API_BASE
        sync: false   # Örn. https://api.pdfplatform.app
      - key: VITE_PUBLIC_SITE_URL
        sync: false   # Örn. https://pdfplatform.app (canonical + hreflang için)
      - key: VITE_SENTRY_DSN
        sync: false
      - key: VITE_GA_MEASUREMENT_ID
        sync: false   # Google Analytics 4 ID (G-XXXXXXXXXX)
