name: CI

on:
  push:
    branches: [main, master, calismaAlani]
    # Yalnızca belge/not değişince tüm kontrolleri (ve deploy'u) boşuna çalıştırma.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "sosyal medya/**"
      - "_screenshots/**"
  pull_request:
    branches: [main, master, calismaAlani]

# Aynı dalda üst üste push gelince eski (artık önemsiz) çalışma iptal edilir → dakika tasarrufu.
# `main` HARİÇ: deploy'u taşıyan çalışma yarıda kesilmesin.
concurrency:
  # main'de her çalışma kendi grubunda: takılı kalan bir çalışma sonrakileri engellemesin (iptal yine yok).
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ─── Değişen dosya denetimi ──────────────────────────────────────────────────
  # Yalnız belge/not değişen PR'larda ağır kontroller atlanır (dakika tasarrufu).
  # Atlanan iş GitHub'ta "geçti" sayılır, zorunlu kontroller PR'ı bloklamaz.
  # Emin olunamazsa (hata, push, kod/iş akışı değişikliği) HER ZAMAN çalıştırılır.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: f
        env:
          EVENT: ${{ github.event_name }}
        run: |
          echo "code=true" >> "$GITHUB_OUTPUT"
          [ "$EVENT" = "pull_request" ] || exit 0
          files=$(git diff --name-only HEAD^1 HEAD) || exit 0
          [ -n "$files" ] || exit 0
          # Belge dışında en az bir dosya varsa kod değişmiş sayılır.
          if echo "$files" | grep -v -E '\.md$|^docs/|^sosyal medya/|^_screenshots/' | grep -q .; then
            exit 0
          fi
          echo "Yalnız belge değişti; ağır kontroller atlanıyor."
          echo "code=false" >> "$GITHUB_OUTPUT"

  # ─── Python Güvenlik Taraması ────────────────────────────────────────────────
  python-security:
    name: Python Security Scan
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: web/backend/requirements.txt

      # Paket sunucusu bazen çok yavaşlıyor (131 MB LibreOffice vb.; normalde ~1 dk, kötü günde >15 dk).
      # Kalıcı çözüm üç katman: (1) indirilen .deb dosyaları önbelleğe alınır — önbellek varsa ağa hiç çıkılmaz;
      # (2) her deneme kısa ve sınırlı, takılırsa kesilir; (3) 2. denemeden itibaren yedek sunucuya (archive.ubuntu.com) geçilir.
      - name: Restore apt package cache
        uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: apt-debs-ubuntu24-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Install system dependencies
        run: |
          mkdir -p ~/apt-debs/partial
          APT="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Dir::Cache::archives=$HOME/apt-debs"
          PKGS="libcairo2-dev pkg-config tesseract-ocr libreoffice-writer libreoffice-calc libreoffice-impress fonts-liberation"
          ok=0
          for i in 1 2 3; do
            if [ "$i" -ge 2 ]; then
              echo "yedek sunucuya geciliyor (deneme $i)"
              sudo sed -i 's#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            fi
            if timeout 300 bash -c "$APT update && $APT install -y $PKGS"; then ok=1; break; fi
            echo "apt denemesi $i basarisiz; tekrar deneniyor"; sleep 5
          done
          [ "$ok" = 1 ] || exit 1
          # wkhtmltopdf yalnız yedek motor (yoksa uygulama xhtml2pdf'e düşer); paket yoksa CI düşmesin.
          timeout 120 $APT install -y wkhtmltopdf || echo "wkhtmltopdf kurulamadi; yedek motor kullanilacak"
          # Önbelleğe yalnız .deb dosyaları gider (kilit/kısmi dosyalar değil).
          sudo chown -R "$USER" ~/apt-debs; rm -rf ~/apt-debs/partial ~/apt-debs/lock

      - name: Install dependencies
        working-directory: web/backend
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -r requirements.txt

      - name: Run pip-audit (fail on CRITICAL or HIGH)
        working-directory: web/backend
        run: |
          pip-audit --format=json --output=audit-report.json || true
          python - <<'EOF'
          import json, sys

          with open("audit-report.json") as f:
              report = json.load(f)

          critical_high = []
          for dep in report.get("dependencies", []):
              for vuln in dep.get("vulns", []):
                  severity = vuln.get("fix_versions") and ""
                  aliases = vuln.get("aliases", [])
                  # pip-audit doesn't always include severity; check via id prefix or description
                  vid = vuln.get("id", "")
                  # Treat all findings as potential HIGH/CRITICAL since pip-audit flags exploitable vulns
                  critical_high.append(
                      f"  {dep['name']}=={dep['version']}: {vid} — {vuln.get('description', '')[:120]}"
                  )

          if critical_high:
              print("CRITICAL/HIGH vulnerabilities found in Python dependencies:")
              print("\n".join(critical_high))
              sys.exit(1)
          else:
              print("No vulnerabilities found.")
          EOF

  # ─── Python Unit Testleri ─────────────────────────────────────────────────
  python-tests:
    name: Python Unit Tests
    # ubuntu-latest 26.04'e geçti ve o sürümde wkhtmltopdf paketi yok; testler tanıdık 24.04 ortamında koşar.
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Takılan test (ör. fork kilitlenmesi) deploy'u 40 dk bekletmesin — net hata ile dur.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: web/backend/requirements.txt

      - name: Sistem paketleri önbelleği (apt)
        # İndirilen .deb dosyaları saklanır; paket sunucusu yavaşlasa bile ikinci çalışmadan itibaren yeniden indirilmez.
        # Anahtarı değiştirmek (v1 -> v2) önbelleği sıfırlar. Önbellek bozuksa apt kendi indirir; test sonucu etkilenmez.
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-ubuntu24.04-py-tests-v1

      - name: Install system dependencies
        # Paket sunucusu bazen yanıt vermeyip adımı 14 dk asılı bırakıyor (normalde ~1 dk).
        # LibreOffice burada KURULMAZ (451 MB; sunucu yavaşlayınca testi saatlerce bekletiyordu). Onu gerektiren testler atlanır, ayrı "python-office-tests" işinde çalışır. Her deneme 8 dk ile sınırlı, 3 deneme; yarım inen paketler devam eder; takılırsa kesilip yeniden denenir.
        run: |
          mkdir -p "$HOME/apt-archives/partial"
          APT="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Dir::Cache::archives=$HOME/apt-archives"
          for i in 1 2 3; do
            timeout 480 bash -c "$APT update && $APT install -y               libcairo2-dev pkg-config tesseract-ocr fonts-liberation" && break
            echo "apt denemesi $i başarısız; tekrar deneniyor"; sleep 5
            [ "$i" = 3 ] && exit 1
          done
          # wkhtmltopdf yalnız yedek motor (yoksa uygulama xhtml2pdf'e düşer); paket yoksa CI düşmesin.
          timeout 120 $APT install -y wkhtmltopdf || echo "wkhtmltopdf kurulamadi; yedek motor kullanilacak"
          # apt yönetici olarak çalıştığı için bıraktığı kilit/partial dosyaları root sahipli kalıyor; önbellek kaydı
          # ("tar: Permission denied") sessizce düşüyordu. Sahipliği düzelt ki önbellek gerçekten kaydedilsin.
          sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-archives"

      - name: Install dependencies
        working-directory: web/backend
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio pytest-timeout
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: web/backend
        env:
          NB_RESULT_STORE_DIR: /tmp/test-result-store
        run: |
          # Kapsam eşiği regresyon koruması içindir (tüm app/ paketi ölçülür).
          # Mevcut taban ~%14; güvenlik-kritik modüller (pdf_security, result_store,
          # billing) tam test edilir. Hedef: kapsamı kademeli %40+'a çıkarmak.
          # --timeout: takılan TEK test 2 dk sonra adıyla başarısız olur; bütün iş 15 dk beklenip
          # adsız "iptal edildi" demesin.
          pytest tests/ \
            --timeout=120 \
            --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=12 \
            -q

  python-office-tests:
    name: Python Office Tests (LibreOffice, zorunlu değil)
    # ubuntu-latest 26.04'e geçti ve o sürümde wkhtmltopdf paketi yok; testler tanıdık 24.04 ortamında koşar.
    runs-on: ubuntu-24.04
    needs: changes
    # Yalnız ana dala birleştikten sonra çalışır; PR'ı bekletmez. Başarısızlık deploy'u engellemez.
    if: needs.changes.outputs.code == 'true' && github.event_name == 'push'
    continue-on-error: true
    # Takılan test (ör. fork kilitlenmesi) deploy'u 40 dk bekletmesin — net hata ile dur.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: web/backend/requirements.txt

      - name: Sistem paketleri önbelleği (apt)
        # İndirilen .deb dosyaları saklanır; paket sunucusu yavaşlasa bile ikinci çalışmadan itibaren yeniden indirilmez.
        # Anahtarı değiştirmek (v1 -> v2) önbelleği sıfırlar. Önbellek bozuksa apt kendi indirir; test sonucu etkilenmez.
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-ubuntu24.04-py-office-v1

      - name: Install system dependencies
        # Paket sunucusu bazen yanıt vermeyip adımı 14 dk asılı bırakıyor (normalde ~1 dk).
        # Her deneme 8 dk ile sınırlı (yavaş sunucuda 131 MB inmesi için), 3 deneme; yarım inen paketler devam eder; takılırsa kesilip yeniden denenir.
        run: |
          mkdir -p "$HOME/apt-archives/partial"
          APT="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Dir::Cache::archives=$HOME/apt-archives"
          for i in 1 2 3; do
            timeout 480 bash -c "$APT update && $APT install -y               libcairo2-dev pkg-config tesseract-ocr               libreoffice-writer libreoffice-calc libreoffice-impress fonts-liberation" && break
            echo "apt denemesi $i başarısız; tekrar deneniyor"; sleep 5
            [ "$i" = 3 ] && exit 1
          done
          # wkhtmltopdf yalnız yedek motor (yoksa uygulama xhtml2pdf'e düşer); paket yoksa CI düşmesin.
          timeout 120 $APT install -y wkhtmltopdf || echo "wkhtmltopdf kurulamadi; yedek motor kullanilacak"
          # apt yönetici olarak çalıştığı için bıraktığı kilit/partial dosyaları root sahipli kalıyor; önbellek kaydı
          # ("tar: Permission denied") sessizce düşüyordu. Sahipliği düzelt ki önbellek gerçekten kaydedilsin.
          sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-archives"

      - name: Install dependencies
        working-directory: web/backend
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio pytest-timeout
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: web/backend
        env:
          NB_RESULT_STORE_DIR: /tmp/test-result-store
        run: |
          # Kapsam eşiği regresyon koruması içindir (tüm app/ paketi ölçülür).
          # Mevcut taban ~%14; güvenlik-kritik modüller (pdf_security, result_store,
          # billing) tam test edilir. Hedef: kapsamı kademeli %40+'a çıkarmak.
          # --timeout: takılan TEK test 2 dk sonra adıyla başarısız olur; bütün iş 15 dk beklenip
          # adsız "iptal edildi" demesin.
          pytest tests/pdf/test_tools_smoke.py \
            --timeout=120 \
            --tb=short \
            -q

  # ─── Node Güvenlik Taraması (Auth API) ───────────────────────────────────
  node-security-api:
    name: Node Security Scan (web/api)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/api/package-lock.json

      - name: Install dependencies
        working-directory: web/api
        run: npm ci

      # Üretim bağımlılıklarındaki açıkları raporlar. BLOKLAMAZ: kalan high/critical'lar
      # ya build/dev araçlarında (esbuild/tsx/vite — prod'a gitmez) ya da üçüncü-parti
      # SDK'lerde (iyzipay→form-data, exceljs→uuid) geçişlidir ve SDK'yı kırmadan
      # düzeltilemez. Loglarda görünür; gerçek düzeltme çıkınca güncellenir.
      - name: Run npm audit (advisory, non-blocking)
        working-directory: web/api
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  # ─── TypeScript Unit Testleri (Auth API) ─────────────────────────────────
  api-unit-tests:
    name: TypeScript Unit Tests (web/api)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/api/package-lock.json

      - name: Install dependencies
        working-directory: web/api
        run: npm ci

      - name: Apply migrations & generate Prisma client
        working-directory: web/api
        env:
          DATABASE_URL: "file:./test.db"
        run: npx prisma migrate deploy && npx prisma generate

      - name: Run vitest
        working-directory: web/api
        env:
          DATABASE_URL: "file:./test.db"
          JWT_ACCESS_SECRET: "ci-test-access-secret-must-be-32chars!!"
          JWT_REFRESH_SECRET: "ci-test-refresh-secret-must-be-32chars!"
          BILLING_ENCRYPTION_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          NODE_ENV: "test"
        run: npm test

  # ─── Node Güvenlik Taraması (Frontend) ───────────────────────────────────
  node-security-frontend:
    name: Node Security Scan (web/frontend)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install dependencies
        working-directory: web/frontend
        run: npm ci

      # Üretim bağımlılıklarındaki açıkları raporlar. BLOKLAMAZ: kalan high/critical'lar
      # build/dev araçlarında (esbuild/vite/shell-quote→concurrently — prod bundle'a
      # gitmez) ve kırıcı upgrade gerektirir. Loglarda görünür; gerçek prod açığı
      # çıkarsa burada ele alınır.
      - name: Run npm audit (advisory, non-blocking)
        working-directory: web/frontend
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  # ─── Kod Denetimi (lint) ─────────────────────────────────────────────────
  # BLOKLAMAZ: denetim yeni kuruldu ve mevcut kod tabanında birikmiş uyarılar var.
  # Amaç, yeni yazılan kodda hataların görünür olması. Uyarılar kademeli olarak
  # temizlendikçe `continue-on-error` kaldırılıp deploy koşuluna eklenmelidir.
  lint-node:
    name: Lint (web/api + web/frontend)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies (web/api)
        working-directory: web/api
        run: npm ci

      - name: Lint web/api
        working-directory: web/api
        run: npm run lint

      - name: Install dependencies (web/frontend)
        working-directory: web/frontend
        run: npm ci

      - name: Lint web/frontend
        working-directory: web/frontend
        run: npm run lint

  lint-python:
    name: Lint (Python)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      # Tanimsiz isim / sozdizimi hatalari GERCEK caliśma zamani hatasidir ve
      # bloklar; diger bulgular yalnizca raporlanir.
      - name: Blocking checks (undefined names, syntax)
        run: ruff check web/backend/app src --select F821,E9

      - name: Full report (advisory)
        run: ruff check web/backend/app src || true

  # ─── PostgreSQL migration denetimi (üretim defteri) ──────────────────────
  # Üretim PostgreSQL'dir; SQLite testleri onu yakalamaz. Burada gerçek bir Postgres'te:
  #  A) defter boş veritabanına sorunsuz uygulanıyor mu,
  #  B) defter ile şema arasında fark var mı (şemaya alan ekleyip defter yazmayı unutmayı yakalar),
  #  C) eski (db push ile kurulmuş) veritabanı güvenle hizalanıp deploy betiği çalışıyor mu.
  api-postgres-migrations:
    name: PostgreSQL Migration Check (web/api)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: main_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGBASE: postgresql://postgres:test@localhost:5432
    defaults:
      run:
        working-directory: web/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Boş veritabanları oluştur
        run: |
          for d in fresh legacy; do
            PGPASSWORD=test psql -h localhost -U postgres -c "CREATE DATABASE $d"
          done

      - name: "A) Defter boş Postgres'e uygulanıyor mu"
        env:
          DATABASE_URL: ${{ env.PGBASE }}/fresh
        run: npx prisma migrate deploy

      - name: "B) Defter uygulanmış veritabanı ile şema arasında fark yok mu"
        env:
          DATABASE_URL: ${{ env.PGBASE }}/fresh
        run: |
          # A adımında defter uygulandı; şimdi o veritabanı şemayla karşılaştırılır.
          # Şemaya alan eklenip defter yazılmadıysa burada fark çıkar ve kontrol kırmızı olur.
          npx prisma migrate diff             --from-config-datasource             --to-schema prisma/schema.postgres.prisma             --exit-code

      - name: "C) Eski (db push) veritabanı → deploy betiği"
        env:
          DATABASE_URL: ${{ env.PGBASE }}/legacy
        run: |
          npx prisma db push --schema prisma/schema.postgres.prisma
          node scripts/prod-db-migrate.mjs
          # İkinci çalıştırma de sorunsuz olmalı (zaten uygulanmış)
          node scripts/prod-db-migrate.mjs

  # ─── TypeScript Tip Denetimi (Auth API) ──────────────────────────────────
  api-typecheck:
    name: TypeScript Type Check (web/api)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/api/package-lock.json

      - name: Install dependencies
        working-directory: web/api
        run: npm ci

      - name: Generate Prisma client
        working-directory: web/api
        run: npx prisma generate

      - name: TypeScript type check
        working-directory: web/api
        run: npx tsc --noEmit

  # ─── Frontend Bileşen Testleri ───────────────────────────────────────────
  frontend-component-tests:
    name: Frontend Component Tests (web/frontend)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install dependencies
        working-directory: web/frontend
        run: npm ci

      - name: Run vitest component tests
        working-directory: web/frontend
        env:
          VITE_API_BASE: http://localhost:8000
          VITE_SAAS_PROXY_TARGET: http://localhost:4000
          VITE_DISABLE_OBFUSCATION: "true"
        run: npm test

      - name: Check test coverage thresholds
        working-directory: web/frontend
        env:
          VITE_API_BASE: http://localhost:8000
          VITE_SAAS_PROXY_TARGET: http://localhost:4000
          VITE_DISABLE_OBFUSCATION: "true"
        run: npm run test:coverage

  # ─── TypeScript Tip Denetimi (Frontend) ──────────────────────────────────
  frontend-typecheck:
    name: TypeScript Type Check (web/frontend)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install dependencies
        working-directory: web/frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: web/frontend
        env:
          VITE_API_BASE: http://localhost:8000
          VITE_SAAS_PROXY_TARGET: http://localhost:4000
          VITE_DISABLE_OBFUSCATION: "true"
        run: npx tsc --noEmit

  # ─── Playwright sürümü — imaj etiketi buradan gelir ──────────────────────
  #
  # NEDEN AYRI BİR İŞ: E2E işi, tarayıcının hazır kurulu geldiği resmi Playwright
  # imajının içinde çalışıyor. O imajın etiketi, projenin kullandığı Playwright
  # sürümüyle AYNI olmak zorunda; tutmazsa tarayıcı bulunamıyor ve testlerin
  # tamamı "Executable doesn't exist" ile düşüyor.
  #
  # Etiket bu dosyaya ELLE yazılıydı. Sonuç: bağımlılık güncelleyen robot
  # Playwright'ı yükseltince (1.59.1 -> 1.63.0) iş akışı dosyasına dokunamadığı
  # için her güncelleme önerisi otomatik olarak kırmızıya düşüyordu. Kod sağlamdı,
  # yalnızca iki sürüm birbirini tutmuyordu.
  #
  # Artık sürüm kilit dosyasından okunuyor: tek kaynak proje bağımlılığı, elle
  # eşitlenecek ikinci bir yer yok.
  playwright-version:
    name: Playwright sürümünü belirle
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read Playwright version from lockfile
        id: read
        working-directory: web/frontend
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          if [ -z "$version" ]; then
            echo "package-lock.json icinde @playwright/test surumu bulunamadi." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Playwright $version -> mcr.microsoft.com/playwright:v$version-noble"

  # ─── Playwright E2E Testleri (UI davranış) ───────────────────────────────
  frontend-e2e:
    name: Frontend E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, playwright-version]
    if: needs.changes.outputs.code == 'true'
    # Resmi Playwright imajı: Chromium + tüm sistem bağımlılıkları HAZIR gelir.
    # Böylece her çalıştırmada ~170MB tarayıcı indirme/install adımı (ve onun
    # takılması) tamamen ortadan kalkar. Etiket artık elle yazılmıyor; yukarıdaki
    # iş onu kilit dosyasından okuyor, yani sürüm ikilemi bir daha yaşanmaz.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install dependencies
        working-directory: web/frontend
        run: npm ci

      - name: Build frontend
        working-directory: web/frontend
        env:
          VITE_API_BASE: http://localhost:8000
          VITE_SAAS_PROXY_TARGET: http://localhost:4000
          VITE_DISABLE_OBFUSCATION: "true"
        run: npm run build

      - name: Run E2E tests
        working-directory: web/frontend
        env:
          CI: "true"
          # Container içinde `localhost` IPv6 (::1) çözülebilir; vite preview
          # IPv4'e bağlandığından her yerde sayısal 127.0.0.1 kullan.
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: |
          # Preview sunucusunu arka planda başlat; çıktısını DOSYAYA yönlendir
          # ki adımın stdout pipe'ını açık tutup job'ı sonsuza kadar
          # bekletmesin (önceki hang'in kök nedeni). --host 127.0.0.1 ile
          # IPv4 loopback'e bağla (container'da localhost/::1 reddediliyordu).
          npm run preview -- --port 4173 --strictPort --host 127.0.0.1 > preview.log 2>&1 &
          PREVIEW_PID=$!
          # Sunucu hazır olana kadar bekle (en fazla 60s). curl yerine node
          # kullan (container imajında node garanti, curl olmayabilir).
          for i in $(seq 1 60); do
            if node -e "require('http').get('http://127.0.0.1:4173',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"; then
              echo "Preview server hazır ($i s)."
              break
            fi
            sleep 1
          done
          cat preview.log || true
          set +e
          npm run e2e -- --reporter=github
          STATUS=$?
          # Sunucuyu ve olası çocuk süreçlerini kesin olarak öldür.
          kill "$PREVIEW_PID" 2>/dev/null || true
          pkill -P "$PREVIEW_PID" 2>/dev/null || true
          exit $STATUS

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/frontend/playwright-report/
          retention-days: 7

  # ─── Deploy — YALNIZCA main push'ta ve YUKARIDAKI TUM job'lar yesilse çalışır ─────
  # Render'da autoDeployTrigger: off; deploy'u kesin olarak BU job tetikler (Deploy
  # Hook'lari POST ederek). Boylece deploy = "CI tamamen yesil" garantisi. Bir job
  # kirmiziysa `needs` yuzunden bu job atlanir → deploy OLMAZ (guvenli kapi).
  deploy:
    name: Deploy to Render (main, CI green)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Adımların `if` koşulu için iş düzeyinde (adım düzeyindeki env `if` içinde görünmez).
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    needs:
      - python-security
      - python-tests
      - node-security-api
      - api-unit-tests
      - node-security-frontend
      - api-typecheck
      - api-postgres-migrations
      - frontend-component-tests
      - frontend-typecheck
      - frontend-e2e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Render pipeline dakikası sınırlı: yalnız dosyası değişen servis deploy edilir.
      # EMİN OLUNAMAZSA (hata, bilinmeyen dosya, ortak dosya) üç servis de deploy edilir.
      #   frontend  <- web/frontend/**
      #   auth-api  <- web/api/**
      #   pdf-api   <- web/backend/** ve src/** (imaj src/'yi de içerir)
      #   hiçbiri   <- yalnız belge/masaüstü paketleme dosyaları
      - name: Hangi servisler değişti
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -u
          echo "auth=true" >> "$GITHUB_OUTPUT"; echo "pdf=true" >> "$GITHUB_OUTPUT"; echo "frontend=true" >> "$GITHUB_OUTPUT"
          base="$BEFORE"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null || echo "$base" | grep -q '^0*$'; then base="HEAD^1"; fi
          files=$(git diff --name-only "$base" HEAD 2>/dev/null) || { echo "Fark okunamadı; hepsi deploy edilecek."; exit 0; }
          [ -n "$files" ] || { echo "Fark boş; hepsi deploy edilecek."; exit 0; }
          auth=false; pdf=false; fe=false
          while IFS= read -r f; do
            case "$f" in
              web/frontend/*) fe=true ;;
              web/api/*) auth=true ;;
              web/backend/*|src/*) pdf=true ;;
              *.md|docs/*|"sosyal medya/"*|_screenshots/*|installer/*|packaging/*|release/*) ;;
              *) auth=true; pdf=true; fe=true ;;   # ortak/bilinmeyen dosya: hepsi
            esac
          done <<< "$files"
          echo "auth=$auth" > "$GITHUB_OUTPUT"; echo "pdf=$pdf" >> "$GITHUB_OUTPUT"; echo "frontend=$fe" >> "$GITHUB_OUTPUT"
          echo "Deploy kapsamı -> auth-api=$auth pdf-api=$pdf frontend=$fe"

      - name: Trigger Render deploy hooks
        env:
          DEPLOY_AUTH: ${{ steps.scope.outputs.auth }}
          DEPLOY_PDF: ${{ steps.scope.outputs.pdf }}
          DEPLOY_FRONTEND: ${{ steps.scope.outputs.frontend }}
          HOOK_AUTH: ${{ secrets.RENDER_DEPLOY_HOOK_AUTH }}
          HOOK_PDF: ${{ secrets.RENDER_DEPLOY_HOOK_PDF }}
          HOOK_FRONTEND: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          trigger() {
            name="$1"; url="$2"
            if [ -z "$url" ]; then
              echo "::warning::$name deploy hook secret bos — atlaniyor (secret ekli mi?)"
              return 0
            fi
            code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$url")
            echo "$name deploy hook -> HTTP $code"
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "::error::$name deploy hook HTTP $code (basarisiz)"
              return 1
            fi
          }
          rc=0
          if [ "$DEPLOY_AUTH" = "true" ];     then trigger "auth-api"  "$HOOK_AUTH"     || rc=1; else echo "auth-api: değişiklik yok, atlandı"; fi
          if [ "$DEPLOY_PDF" = "true" ];      then trigger "pdf-api"   "$HOOK_PDF"      || rc=1; else echo "pdf-api: değişiklik yok, atlandı"; fi
          if [ "$DEPLOY_FRONTEND" = "true" ]; then trigger "frontend"  "$HOOK_FRONTEND" || rc=1; else echo "frontend: değişiklik yok, atlandı"; fi
          exit $rc

      # ─── Sentry: release + commit bağlama + "production" deploy işareti ─────────
      # SENTRY_AUTH_TOKEN yoksa adımlar atlanır (deploy'u asla bozmaz).
      # Frontend'in release/deploy kaydını Render build'indeki Sentry eklentisi yapar.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # commit geçmişi Sentry'ye bağlanabilsin

      - name: Sentry deploy kaydı (nb-auth-api)
        if: env.SENTRY_AUTH_TOKEN != ''
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: nb-global-studio-cv
          SENTRY_PROJECT: nb-auth-api
        with:
          environment: production
          release: nb-auth-api@${{ github.sha }}
          ignore_missing: true
          ignore_empty: true

      - name: Sentry deploy kaydı (nb-pdf-api)
        if: env.SENTRY_AUTH_TOKEN != ''
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: nb-global-studio-cv
          SENTRY_PROJECT: nb-pdf-api
        with:
          environment: production
          release: nb-pdf-api@${{ github.sha }}
          ignore_missing: true
          ignore_empty: true
