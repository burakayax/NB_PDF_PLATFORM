name: Yapay zeka ajanlari

# Zamanlanmis, SALT OKUNUR ajanlar. Cikti ASLA depoya/is gunlugune/artifact'a yazilmaz; ozel R2 kovasina gider.
# Yalniz zamanlama ve elle baslatma ile calisir; pull_request/push ile ASLA tetiklenmez.
# Saatler UTC (TR = UTC+3):
#   Ajan 1 durum   07:37 TR = 04:37 UTC (her gun)
#   Ajan 2 seo     07:07 TR = 04:07 UTC (pazartesi)
#   Ajan 3 sosyal  07:23 TR = 04:23 UTC (pazartesi)
#   Ajan 4 finans  07:47 TR = 04:47 UTC (ayin 1'i)
#   Ajan 5 ozet    08:19 TR = 05:19 UTC (her gun)
#   Ajan 6 bakim   07:53 TR = 04:53 UTC (pazartesi; GOLGE: yalniz rapor, hicbir sey yapmaz)
# Dakikalar bilerek "tuhaf": GitHub tam saat ve yarim saat basinda cok yogun oldugundan
# zamanlanmis isleri saatlerce geciktirebiliyor (19-20 Kasim 2026'da ~9 saat). Sira korunur.
on:
  schedule:
    - cron: "37 4 * * *"
    - cron: "7 4 * * 1"
    - cron: "23 4 * * 1"
    - cron: "47 4 1 * *"
    - cron: "19 5 * * *"
    - cron: "53 4 * * 1"
  workflow_dispatch:
    inputs:
      ajan:
        description: "Calistirilacak ajan"
        required: true
        type: choice
        options: [durum, seo, sosyal, finans, ozet, bakim]

permissions:
  contents: read

concurrency:
  group: ajanlar
  cancel-in-progress: false

jobs:
  calistir:
    name: Ajan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Ajani sec
        id: sec
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUEL: ${{ github.event.inputs.ajan }}
        run: |
          if [ -n "$MANUEL" ]; then a="$MANUEL"; else
            case "$SCHEDULE" in
              "37 4 * * *") a=durum ;;
              "7 4 * * 1") a=seo ;;
              "23 4 * * 1") a=sosyal ;;
              "47 4 1 * *") a=finans ;;
              "19 5 * * *") a=ozet ;;
              "53 4 * * 1") a=bakim ;;
              *) echo "::error::Bilinmeyen zamanlama"; exit 1 ;;
            esac
          fi
          echo "ajan=$a" >> "$GITHUB_OUTPUT"
      - name: Kova verisini indir (salt okuma)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OZET_R2_YAZMA_ANAHTAR_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OZET_R2_YAZMA_GIZLI }}
          OZET_R2_ACCOUNT_ID: ${{ secrets.OZET_R2_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: auto
        run: |
          set +x
          ep="https://${OZET_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          mkdir -p veri cikti
          aws s3 sync s3://nb-gecelik-ozet/ozet veri/ozet --endpoint-url "$ep" --exclude "*" --include "*.json" --only-show-errors
          for f in ajan-durum-son.md ajan-seo-son.md ajan-sosyal-son.md ajan-finans-son.md ajan-bakim-son.json ajan-maliyet.json; do
            aws s3 cp "s3://nb-gecelik-ozet/$f" "veri/$f" --endpoint-url "$ep" --only-show-errors || true
          done
      - name: Ajani calistir
        id: run
        env:
          ANTHROPIC_AGENT_API_KEY: ${{ secrets.ANTHROPIC_AGENT_API_KEY }}
          AGENT_DATA_TOKEN: ${{ secrets.AGENT_DATA_TOKEN }}
          AGENT: ${{ steps.sec.outputs.ajan }}
          GH_TOKEN: ${{ github.token }}
          AGENT_VERI: veri
          AGENT_OUT: cikti
        run: |
          set +x
          node scripts/agents/run.mjs "$AGENT"
      - name: Ciktiyi ozel kovaya yaz
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OZET_R2_YAZMA_ANAHTAR_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OZET_R2_YAZMA_GIZLI }}
          OZET_R2_ACCOUNT_ID: ${{ secrets.OZET_R2_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: auto
        run: |
          set +x
          ep="https://${OZET_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          for f in cikti/*; do
            [ -f "$f" ] || continue
            ct="text/markdown; charset=utf-8"; case "$f" in *.json) ct=application/json ;; esac
            aws s3 cp "$f" "s3://nb-gecelik-ozet/$(basename "$f")" --endpoint-url "$ep" --content-type "$ct" --only-show-errors
          done
