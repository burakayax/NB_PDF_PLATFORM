name: Arac videosu uretimi

# Araç tanıtım videosu (Reels) PAYLAŞIMDAN ÖNCE üretilir ve paylaşıldıktan sonra silinir.
#
# Akış: API'ye "üretim gerekli mi?" diye sorulur → gerekliyse aracın animasyon sahnesi
# (web/frontend/scripts/tool-reels/scenes/) kare kare videoya çevrilir, müziği sentezlenir → MP4 API'ye
# yüklenir. Günlük paylaşım turu videoyu Reels gönderisine çevirir; paylaşılınca API videoyu siler
# (bu iş hiçbir şey saklamaz). Siteye giriş ve ekran kaydı YOKTUR. Video kuralları: tool-reels/README.md
#
# ÜÇ SÜRÜM: Aynı sahneden üç video çıkar, yalnız kapanıştaki yönlendirme cümlesi farklıdır.
#   reel.mp4          → Instagram          ("Bağlantı profilde"; açıklamadaki adres tıklanmaz)
#   reel-aciklama.mp4 → YouTube ("Bağlantı açıklamada"; açıklamadaki adres tıklanır)
#   reel-yorum.mp4    → Facebook ("Bağlantı yorumlarda"; bağlantı ilk yoruma konur)
#
# GEREKLİ GİZLİ ANAHTARLAR (GitHub → Settings → Secrets and variables → Actions):
#   TOOL_REEL_API_BASE     Kimlik API'nin dışarıdan erişilen kökü, ör. https://api.pdfplatform.app
#   TOOL_REEL_FACTORY_KEY  Rastgele uzun parola; API'de AYNI değer TOOL_REEL_FACTORY_KEY olarak tanımlı olmalı
# Biri yoksa iş sessizce atlanır (hata vermez). Eski REELS_SITE_URL / REELS_DEMO_* anahtarları artık kullanılmaz.
#
# SAAT: Günde BİR kez, her sabah 08:30'da (Türkiye saati = 05:30 UTC) API'ye "video lazım mı?"
# diye sorulur. Lazımsa o anda üretilir; değilse iş birkaç saniyede biter. Saati değiştirmek için
# aşağıdaki cron'un UTC saatini ayarla (TR saati − 3). Paylaşım saati sabah 08:30'dan ÖNCE ise
# o günün videosu geç gelen video olarak eklenir.

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      tool:
        description: "Elle üret: sahnesi olan araç kimliği (udf-to-pdf, gorsel-sikistir, aranabilir-pdf, pdf-to-excel). Boş bırakılırsa yalnızca sıradaki araç için, gerekiyorsa üretilir."
        required: false
        default: ""

concurrency:
  group: tool-reels
  cancel-in-progress: false

jobs:
  produce:
    name: Video uret ve yukle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_BASE: ${{ secrets.TOOL_REEL_API_BASE }}
      FACTORY_KEY: ${{ secrets.TOOL_REEL_FACTORY_KEY }}
      TOOL_INPUT: ${{ inputs.tool }}
    steps:
      - name: Uretim gerekli mi?
        id: need
        run: |
          set -euo pipefail
          if [ -z "${API_BASE:-}" ] || [ -z "${FACTORY_KEY:-}" ]; then
            echo "Gizli anahtarlar tanimli degil; atlandi."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          QS=""
          if [ -n "${TOOL_INPUT:-}" ]; then QS="?tool=${TOOL_INPUT}"; fi
          RESP="$(curl -fsS --max-time 60 -H "x-factory-key: ${FACTORY_KEY}" "${API_BASE%/}/api/tool-reel-factory/needed${QS}")"
          echo "Yanit: $RESP"
          echo "needed=$(echo "$RESP" | jq -r '.needed')" >> "$GITHUB_OUTPUT"
          echo "tool=$(echo "$RESP" | jq -r '.tool // ""')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.need.outputs.needed == 'true'

      - uses: actions/setup-node@v4
        if: steps.need.outputs.needed == 'true'
        with:
          node-version: "24"

      - name: Bagimliliklari kur
        if: steps.need.outputs.needed == 'true'
        run: |
          set -euo pipefail
          # Yalnızca tarayıcı + ffmpeg + yedek yazı tipleri (✓ ★ gibi simgeler ve serif başlık için).
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation
          (cd web/frontend && npm ci && npx playwright install --with-deps chromium)

      - name: Videoyu uret
        if: steps.need.outputs.needed == 'true'
        working-directory: web/frontend
        env:
          FFMPEG_PATH: /usr/bin/ffmpeg
        run: |
          set -euo pipefail
          node scripts/tool-reels/run.mjs \
            --tool "${{ steps.need.outputs.tool }}" \
            --out "$RUNNER_TEMP/reel.mp4" \
            --work "$RUNNER_TEMP/reel-work" | tee "$RUNNER_TEMP/reel.log"
          tail -n 1 "$RUNNER_TEMP/reel.log" | jq -r '.seconds' > "$RUNNER_TEMP/reel.seconds"

      - name: Videoyu denetle
        if: steps.need.outputs.needed == 'true'
        run: |
          set -euo pipefail
          for F in reel.mp4 reel-aciklama.mp4 reel-yorum.mp4; do
            V="$RUNNER_TEMP/$F"
            echo "== $F =="
            ls -l "$V"
            ffprobe -v error -show_entries format=duration,size:stream=index,codec_type,codec_name,width,height,duration -of default=nw=1 "$V"
            DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$V")"
            echo "Sure: ${DUR}"
            # Bozuk/bos video sunucuya yuklenmesin.
            awk -v d="$DUR" 'BEGIN { exit !(d+0 >= 10) }'
            # Meta Reels şartları (9:16, 1080x1920, 24-60 fps, 3-90 sn, AAC 48 kHz stereo).
            W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$V")"
            H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$V")"
            FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$V")"
            AR="$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of csv=p=0 "$V")"
            AC="$(ffprobe -v error -select_streams a:0 -show_entries stream=channels -of csv=p=0 "$V")"
            echo "Meta sartlari: ${W}x${H} ${FPS} fps, ses ${AR} Hz ${AC} kanal"
            [ "$W" = "1080" ] && [ "$H" = "1920" ] && [ "$FPS" = "30/1" ] && [ "$AR" = "48000" ] && [ "$AC" = "2" ]
          done

      - name: Videoyu inceleme icin sakla
        if: always() && steps.need.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: arac-videosu-cikti
          path: |
            ${{ runner.temp }}/reel.mp4
            ${{ runner.temp }}/reel-aciklama.mp4
            ${{ runner.temp }}/reel-yorum.mp4
          if-no-files-found: ignore
          retention-days: 2

      - name: Videoyu API'ye yukle
        if: steps.need.outputs.needed == 'true'
        run: |
          set -euo pipefail
          # Once Instagram surumu, sonra YouTube + Facebook surumu.
          curl -fsS --max-time 300 -X PUT \
            -H "x-factory-key: ${FACTORY_KEY}" \
            -H "content-type: video/mp4" \
            -H "x-video-seconds: $(cat "$RUNNER_TEMP/reel.seconds")" \
            --data-binary "@$RUNNER_TEMP/reel.mp4" \
            "${API_BASE%/}/api/tool-reel-factory/${{ steps.need.outputs.tool }}/video"
          curl -fsS --max-time 300 -X PUT \
            -H "x-factory-key: ${FACTORY_KEY}" \
            -H "x-video-variant: caption" \
            -H "content-type: video/mp4" \
            -H "x-video-seconds: $(cat "$RUNNER_TEMP/reel.seconds")" \
            --data-binary "@$RUNNER_TEMP/reel-aciklama.mp4" \
            "${API_BASE%/}/api/tool-reel-factory/${{ steps.need.outputs.tool }}/video"
          curl -fsS --max-time 300 -X PUT \
            -H "x-factory-key: ${FACTORY_KEY}" \
            -H "x-video-variant: comment" \
            -H "content-type: video/mp4" \
            -H "x-video-seconds: $(cat "$RUNNER_TEMP/reel.seconds")" \
            --data-binary "@$RUNNER_TEMP/reel-yorum.mp4" \
            "${API_BASE%/}/api/tool-reel-factory/${{ steps.need.outputs.tool }}/video"
