name: Arac videosu uretimi

# Araç tanıtım videosu (Reels) PAYLAŞIMDAN ÖNCE üretilir ve paylaşıldıktan sonra silinir.
#
# Akış: API'ye "üretim gerekli mi?" diye sorulur → gerekliyse tarayıcı CANLI siteye özel bir deneme
# hesabıyla girer, aracı gerçekten kullanarak ekranı kaydeder → MP4 API'ye yüklenir. Günlük paylaşım
# turu videoyu Instagram + Facebook Reels'e çevirir; paylaşılınca API videoyu siler (bu iş hiçbir
# şey saklamaz). Yapay zekâ kullanan araçlar bu işe EKLENMEZ (kredi/ücret keser).
#
# GEREKLİ GİZLİ ANAHTARLAR (GitHub → Settings → Secrets and variables → Actions):
#   TOOL_REEL_API_BASE     Kimlik API'nin dışarıdan erişilen kökü, ör. https://api.pdfplatform.app
#   TOOL_REEL_FACTORY_KEY  Rastgele uzun parola; API'de AYNI değer TOOL_REEL_FACTORY_KEY olarak tanımlı olmalı
#   REELS_SITE_URL         Kaydın yapılacağı canlı site, ör. https://pdfplatform.app
#   REELS_DEMO_EMAIL       Canlıda açılmış, PRO yetkili özel deneme hesabının e-postası
#   REELS_DEMO_PASSWORD    O hesabın şifresi
# Biri yoksa iş sessizce atlanır (hata vermez).
#
# SAAT: Her 30 dakikada bir API'ye sorulur; API yalnızca normal gönderilerle AYNI paylaşım
# saatine göre (hazırlık anından ~2,5 saat önce) "üret" der. Paylaşım saatini panelden
# değiştirsen bu dosyada bir şey değiştirmen gerekmez.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      tool:
        description: "Elle üret: araç kimliği (compress, merge). Boş bırakılırsa yalnızca sıradaki araç için, gerekiyorsa üretilir."
        required: false
        default: ""

concurrency:
  group: tool-reels
  cancel-in-progress: false

jobs:
  produce:
    name: Video uret ve yukle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_BASE: ${{ secrets.TOOL_REEL_API_BASE }}
      FACTORY_KEY: ${{ secrets.TOOL_REEL_FACTORY_KEY }}
      TOOL_INPUT: ${{ inputs.tool }}
      SITE_URL: ${{ secrets.REELS_SITE_URL }}
      REELS_DEMO_EMAIL: ${{ secrets.REELS_DEMO_EMAIL }}
      REELS_DEMO_PASSWORD: ${{ secrets.REELS_DEMO_PASSWORD }}
    steps:
      - name: Uretim gerekli mi?
        id: need
        run: |
          set -euo pipefail
          if [ -z "${API_BASE:-}" ] || [ -z "${FACTORY_KEY:-}" ] || [ -z "${SITE_URL:-}" ] || [ -z "${REELS_DEMO_EMAIL:-}" ] || [ -z "${REELS_DEMO_PASSWORD:-}" ]; then
            echo "Gizli anahtarlar tanimli degil; atlandi."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          QS=""
          if [ -n "${TOOL_INPUT:-}" ]; then QS="?tool=${TOOL_INPUT}"; fi
          RESP="$(curl -fsS --max-time 60 -H "x-factory-key: ${FACTORY_KEY}" "${API_BASE%/}/api/tool-reel-factory/needed${QS}")"
          echo "Yanit: $RESP"
          echo "needed=$(echo "$RESP" | jq -r '.needed')" >> "$GITHUB_OUTPUT"
          echo "tool=$(echo "$RESP" | jq -r '.tool // ""')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.need.outputs.needed == 'true'

      - uses: actions/setup-python@v5
        if: steps.need.outputs.needed == 'true'
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        if: steps.need.outputs.needed == 'true'
        with:
          node-version: "24"

      - name: Bagimliliklari kur
        if: steps.need.outputs.needed == 'true'
        run: |
          set -euo pipefail
          # Site kurulmaz: kayit CANLI siteye girilerek yapilir. Yalnizca ornek belge (python) + tarayici + ffmpeg gerekir.
          # ffmpeg-static Linux derlemesinde yazi filtresi (drawtext) yok; sistemin ffmpeg'i yazi destekler.
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -hide_banner -filters | grep -q drawtext
          python -m pip install --upgrade pip
          pip install pymupdf pillow
          (cd web/frontend && npm ci && npx playwright install --with-deps chromium)

      - name: Videoyu uret
        if: steps.need.outputs.needed == 'true'
        working-directory: web/frontend
        env:
          FFMPEG_PATH: /usr/bin/ffmpeg
        run: |
          set -euo pipefail
          node scripts/tool-reels/run.mjs \
            --tool "${{ steps.need.outputs.tool }}" \
            --base "${SITE_URL}" \
            --out "$RUNNER_TEMP/reel.mp4" \
            --work "$RUNNER_TEMP/reel-work" | tee "$RUNNER_TEMP/reel.log"
          tail -n 1 "$RUNNER_TEMP/reel.log" | jq -r '.seconds' > "$RUNNER_TEMP/reel.seconds"

      - name: Videoyu denetle
        if: steps.need.outputs.needed == 'true'
        run: |
          set -euo pipefail
          ls -l "$RUNNER_TEMP/reel.mp4"
          ffprobe -v error -show_entries format=duration,size:stream=index,codec_type,codec_name,width,height,duration -of default=nw=1 "$RUNNER_TEMP/reel.mp4"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$RUNNER_TEMP/reel.mp4")"
          echo "Sure: ${DUR}"
          # Bozuk/bos video sunucuya yuklenmesin.
          awk -v d="$DUR" 'BEGIN { exit !(d+0 >= 10) }'
          # Meta Reels şartları (9:16, 1080x1920, 24-60 fps, 3-90 sn, AAC 48 kHz stereo).
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$RUNNER_TEMP/reel.mp4")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$RUNNER_TEMP/reel.mp4")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$RUNNER_TEMP/reel.mp4")"
          AR="$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of csv=p=0 "$RUNNER_TEMP/reel.mp4")"
          AC="$(ffprobe -v error -select_streams a:0 -show_entries stream=channels -of csv=p=0 "$RUNNER_TEMP/reel.mp4")"
          echo "Meta sartlari: ${W}x${H} ${FPS} fps, ses ${AR} Hz ${AC} kanal"
          [ "$W" = "1080" ] && [ "$H" = "1920" ] && [ "$FPS" = "30/1" ] && [ "$AR" = "48000" ] && [ "$AC" = "2" ]

      - name: Videoyu inceleme icin sakla
        if: always() && steps.need.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: arac-videosu-cikti
          path: ${{ runner.temp }}/reel.mp4
          if-no-files-found: ignore
          retention-days: 2

      - name: Videoyu API'ye yukle
        if: steps.need.outputs.needed == 'true'
        run: |
          set -euo pipefail
          curl -fsS --max-time 300 -X PUT \
            -H "x-factory-key: ${FACTORY_KEY}" \
            -H "content-type: video/mp4" \
            -H "x-video-seconds: $(cat "$RUNNER_TEMP/reel.seconds")" \
            --data-binary "@$RUNNER_TEMP/reel.mp4" \
            "${API_BASE%/}/api/tool-reel-factory/${{ steps.need.outputs.tool }}/video"

      - name: Hata ekran goruntusu
        if: failure() && steps.need.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: arac-videosu-hata
          path: ${{ runner.temp }}/reel-work/hata.png
          if-no-files-found: ignore
          retention-days: 3
