<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Türkçe sesli okuma denemesi (geçici)</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:720px;margin:24px auto;padding:0 16px;background:#0f172a;color:#e2e8f0}
  textarea,select,button{font:inherit;width:100%;box-sizing:border-box;margin:6px 0;padding:10px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#e2e8f0}
  button{background:#2563eb;border:0;cursor:pointer;font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td,th{border-bottom:1px solid #334155;padding:6px;text-align:left}
  .ok{color:#34d399}.no{color:#f87171}
</style>
</head>
<body>
<h1>Türkçe sesli okuma denemesi</h1>
<p>Bu sayfa <b>geçici</b>dir: tarayıcının kendi sesinin (Web Speech) bu cihazda Türkçeyi nasıl okuduğunu dinlemeniz içindir. Metin hiçbir yere gönderilmez.</p>
<p id="durum"></p>
<label>Ses
  <select id="ses"></select>
</label>
<label>Hız <input id="hiz" type="range" min="0.6" max="1.4" step="0.1" value="1" style="width:100%"></label>
<label>Metin
<textarea id="metin" rows="9">Sayın Hâkim, dava dilekçemde belirttiğim nedenlerle; ilgili kararın kaldırılmasını talep ediyorum. Şirketimizin 2026 yılı gelirleri %12,5 artarak 3.450.000 TL'ye ulaşmıştır. Toplantı 14.30'da İstanbul'da, Çankaya Caddesi No: 7'de yapılacaktır. İğne, ığdır, öğretmen, şemsiye, ağaç ve Işık gibi sözcükleri doğru okuyor mu?</textarea></label>
<label>Okuma modu
  <select id="mod"><option value="akici">Akıcı (metni hazırla + cümle cümle oku)</option><option value="ham">Ham (olduğu gibi tek parça)</option></select>
</label>
<details><summary>Okunacak hazırlanmış metin</summary><pre id="hazir" style="white-space:pre-wrap"></pre></details>
<button id="oku">Oku</button>
<button id="dur" style="background:#475569">Durdur</button>
<h2>Bulunan Türkçe sesler</h2>
<table id="tablo"><thead><tr><th>Ad</th><th>Dil</th><th>Cihazda</th></tr></thead><tbody></tbody></table>
<script>
const ss = window.speechSynthesis;
const durum = document.getElementById('durum');
if(!ss){ durum.innerHTML='<span class="no">Bu tarayıcı sesli okumayı desteklemiyor.</span>'; }
function yukle(){
  const tr = ss.getVoices().filter(v=>/^tr/i.test(v.lang));
  const sel = document.getElementById('ses'); sel.innerHTML='';
  const tb = document.querySelector('#tablo tbody'); tb.innerHTML='';
  tr.forEach((v,i)=>{
    sel.add(new Option(v.name+' ('+v.lang+')', i));
    tb.insertAdjacentHTML('beforeend','<tr><td>'+v.name+'</td><td>'+v.lang+'</td><td>'+(v.localService?'evet (çevrimdışı)':'hayır (internetten)')+'</td></tr>');
  });
  durum.innerHTML = tr.length ? '<span class="ok">'+tr.length+' Türkçe ses bulundu.</span>' : '<span class="no">Bu cihazda Türkçe ses bulunamadı.</span>';
  window._tr = tr;
}
if(ss){ ss.onvoiceschanged = yukle; yukle(); }

// ---- Metin hazırlama: sesin takılmasına yol açan işaretleri sadeleştirir ----
const KISALTMA = [[/\bSn\.\s*/g,'Sayın '],[/\bDr\.\s*/g,'Doktor '],[/\bAv\.\s*/g,'Avukat '],[/\bProf\.\s*/g,'Profesör '],
  [/\bCad\.\s*/g,'Caddesi '],[/\bSk\.\s*/g,'Sokak '],[/\bMah\.\s*/g,'Mahallesi '],[/\bNo\s*[:.]\s*/g,'numara '],
  [/\bvb\./g,'ve benzeri'],[/\bvs\./g,'vesaire'],[/\bbkz\.\s*/gi,'bakınız '],[/\bTC\b|\bT\.C\./g,'Türkiye Cumhuriyeti']];
// ---- Sayıyı Türkçe yazıya çevirir: 3450000 -> "üç milyon dört yüz elli bin" ----
const BIR=['','bir','iki','üç','dört','beş','altı','yedi','sekiz','dokuz'],ON=['','on','yirmi','otuz','kırk','elli','altmış','yetmiş','seksen','doksan'];
const BASAMAK=['','bin','milyon','milyar','trilyon'];
function ucluk(n){ // 0-999
  const y=Math.floor(n/100),o=Math.floor(n%100/10),b=n%10;
  return (y?(y>1?BIR[y]+' ':'')+'yüz ':'')+(o?ON[o]+' ':'')+(b?BIR[b]+' ':'');
}
function sayiYazi(str){
  if(/^0\d/.test(str)||str.length>=11) return str.split('').map(c=>c==='0'?'sıfır':BIR[+c]).join(' '); // 007, TC no, telefon, kart no: rakam rakam
  let n=BigInt(str); if(n===0n) return 'sıfır';
  const parcalar=[];
  while(n>0n){parcalar.push(Number(n%1000n));n/=1000n;}
  let out='';
  for(let k=parcalar.length-1;k>=0;k--){
    const p=parcalar[k]; if(!p) continue;
    if(k===1&&p===1) out+='bin '; else out+=ucluk(p)+(BASAMAK[k]?BASAMAK[k]+' ':'');
  }
  return out.trim();
}
const AYLAR=['','Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
function hazirla(t){
  t=t.replace(/\r?\n+/g,' ').replace(/\s+/g,' ');
  KISALTMA.forEach(([r,y])=>{t=t.replace(r,y);});
  t=t.replace(/\b(\d{1,2})\.(\d{1,2})\.(\d{4})\b/g,(m,g,a,y)=>+a>=1&&+a<=12&&+g>=1&&+g<=31?sayiYazi(String(+g))+' '+AYLAR[+a]+' '+sayiYazi(y):m); // 03.11.2026 -> üç Kasım iki bin yirmi altı
  t=t.replace(/(\d{1,2})[.:](\d{2})\b(?!\s*(?:TL|lira|\d))/g,(m,a,b)=>+a<24&&+b<60?sayiYazi(String(+a))+(b==='00'?'':' '+(b[0]==='0'?'sıfır ':'')+sayiYazi(String(+b))):m); // 14.30 -> on dört otuz
  t=t.replace(/(\d)\.(?=\d{3}(?!\d))/g,'$1');            // 3.450.000 -> 3450000
  t=t.replace(/(\d+),(\d+)/g,'$1 virgül $2');            // 12,5 -> 12 virgül 5
  t=t.replace(/%\s*(\d+(?: virgül \d+)?)/g,'yüzde $1').replace(/(\d+(?: virgül \d+)?)\s*%/g,'yüzde $1');
  const EK={ye:'ya',yi:'yı',nin:'nın',den:'dan',de:'da',dir:'dır',yle:'yla',e:'ya',i:'yı'};
  t=t.replace(/\bTL['’](\w+)/g,(m,e)=>'lira'+(EK[e]?EK[e].replace(/^y/,'y'):'')); // TL'ye -> liraya
  t=t.replace(/₺\s*(\d+)/g,'$1 Türk lirası').replace(/\bTL\b/g,'Türk lirası');
  t=t.replace(/\d+/g,m=>sayiYazi(m));                  // kalan tüm sayılar yazıya
  t=t.replace(/[…]|\.{2,}/g,'.').replace(/;|:\s/g,', ').replace(/\s[-–—]+\s|[–—]/g,', ');
  t=t.replace(/[()\[\]{}“”*_#\/\|<>]/g,' ');  // kesme işareti (7'de, İstanbul'da) KORUNUR: sesler ekleri onunla doğru okur
  t=t.replace(/\s*,(\s*,)+/g,',').replace(/\s+([,.!?])/g,'$1').replace(/,\s*([.!?])/g,'$1').replace(/\s+/g,' ').trim();
  return t;
}
function parcala(t,max=200){
  const cumleler=t.match(/[^.!?]+[.!?]*/g)||[t];
  const out=[];let cur='';
  const ekle=c=>{ if((cur+' '+c).trim().length>max && cur){out.push(cur.trim());cur=c;} else cur=(cur+' '+c).trim(); };
  cumleler.forEach(c=>{
    c=c.trim(); if(!c) return;
    if(c.length>max){ c.split(/(?<=,)\s+/).forEach(ekle); } else ekle(c);
  });
  if(cur) out.push(cur.trim());
  return out;
}
let keep=null;
function oku(){
  ss.cancel(); clearInterval(keep);
  const ham=document.getElementById('mod').value==='ham';
  const raw=document.getElementById('metin').value;
  const hazir=ham?raw:hazirla(raw);
  document.getElementById('hazir').textContent=ham?raw:parcala(hazir).join('\n— ');
  const parcalar=ham?[raw]:parcala(hazir);
  const v=(window._tr||[])[document.getElementById('ses').value];
  const rate=parseFloat(document.getElementById('hiz').value);
  const uts=parcalar.map(p=>{const u=new SpeechSynthesisUtterance(p); if(v){u.voice=v;u.lang=v.lang;}else u.lang='tr-TR'; u.rate=rate; return u;});
  // Hepsini baştan sıraya koy: parçalar arasında boşluk kalmasın.
  uts.forEach(u=>ss.speak(u));
  // Chrome'da internetten gelen seslerde ~15 sn sonra konuşma kesilir; periyodik canlı tutma.
  keep=setInterval(()=>{ if(!ss.speaking){clearInterval(keep);return;} ss.pause(); ss.resume(); },10000);
}
document.getElementById('oku').onclick=oku;
document.getElementById('dur').onclick = ()=>{ss.cancel();clearInterval(keep);};
</script>
</body>
</html>
