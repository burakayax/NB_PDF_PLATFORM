<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sayfa bulunamadı | PDF Platform</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#020617;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:24px}
  p{color:#94a3b8;max-width:420px;line-height:1.6}
  a{display:inline-block;margin-top:16px;background:#0891b2;color:#fff;padding:12px 20px;border-radius:12px;text-decoration:none;font-weight:600}
  [lang=en]{display:none}
  body.en [lang=tr]{display:none}
  body.en [lang=en]{display:block}
</style>
</head>
<body>
<main>
  <div lang="tr"><h1>Sayfa bulunamadı</h1><p>Adres yanlış yazılmış ya da bu sayfa taşınmış olabilir. Ana sayfadan tüm araçlara ulaşabilirsin.</p><a href="/">Ana sayfaya dön</a></div>
  <div lang="en"><h1>Page not found</h1><p>The address may be mistyped, or this page may have moved. You can reach every tool from the home page.</p><a href="/en">Back to home</a></div>
</main>
<script>
  if (/^\/en(\/|$)/.test(location.pathname)) { document.body.className = "en"; document.documentElement.lang = "en"; document.title = "Page not found | PDF Platform"; }
</script>
</body>
</html>
