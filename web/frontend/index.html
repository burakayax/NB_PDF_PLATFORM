<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="PDF birleştirme, dönüştürme, sıkıştırma ve düzenleme işlemlerini tek platformda yapın. Kurulum gerekmez — tarayıcıdan ve Windows'tan çalışır."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- Sosyal paylaşım temel etiketleri (route bazlı prerender bunları ezer).
         WhatsApp/OG mutlak URL ister — göreli URL önizlemeyi bozar. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PDF PLATFORM" />
    <meta property="og:url" content="https://pdfplatform.app/" />
    <meta property="og:title" content="PDF Birleştir, Dönüştür, Sıkıştır | PDF PLATFORM" />
    <meta property="og:description" content="PDF birleştirme, dönüştürme, sıkıştırma ve düzenleme işlemlerini tek platformda yapın." />
    <meta property="og:image" content="https://pdfplatform.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PDF PLATFORM — Birleştir, Dönüştür, Sıkıştır, Düzenle" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://pdfplatform.app/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Render-blocking olmayan font yüklemesi: stil önce preload, yüklenince stylesheet'e çevrilir.
         display=swap ile metin hemen sistem fontuyla boyanır (FCP/LCP iyileşir, FOIT yok). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="PDF PLATFORM" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PDF PLATFORM" />

    <!-- Windows -->
    <meta name="msapplication-TileColor" content="#0f172a" />
    <meta name="msapplication-TileImage" content="/icons/icon-144.png" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <title>PDF Birleştir, Dönüştür, Sıkıştır | PDF PLATFORM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
